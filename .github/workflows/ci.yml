name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0

      - name: Build and test
        run: make check

  dynamic-analysis:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Valgrind
        run: |
          sudo apt-get update
          sudo apt-get install --yes valgrind

      - name: Check memory safety
        run: make valgrind-check

      - name: Exercise profiling path
        run: make cachegrind-check
